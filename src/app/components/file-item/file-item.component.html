<div class="file-item" (click)="onItemClick($event)">
	<div class="file-icon">
		<svg
			*ngIf="file.folder"
			width="24"
			height="24"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2">
			<path
				d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z" />
		</svg>

		<svg
			*ngIf="!file.folder"
			width="24"
			height="24"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2">
			<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
			<polyline points="14,2 14,8 20,8" />
		</svg>
	</div>

	<div class="file-info">
		<div class="file-name" [title]="file.name">{{ file.name }}</div>
	</div>

	<div class="file-actions">
		<button *ngIf="!file.folder" (click)="onDownload($event)" title="Download">
			<svg
				width="16"
				height="16"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2">
				<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
				<polyline points="7,10 12,15 17,10" />
				<line x1="12" y1="15" x2="12" y2="3" />
			</svg>
		</button>

		<button (click)="onDelete($event)" title="Delete">
			<svg
				width="16"
				height="16"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2">
				<polyline points="3,6 5,6 21,6" />
				<path
					d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />
			</svg>
		</button>
	</div>
</div>
