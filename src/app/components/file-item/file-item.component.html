<div class="file-item">
	<div class="file-icon">
		<svg
			*ngIf="file.folder"
			width="24"
			height="24"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2">
			<path
				d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z" />
		</svg>

		<svg
			*ngIf="!file.folder"
			width="24"
			height="24"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2">
			<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
			<polyline points="14,2 14,8 20,8" />
		</svg>
	</div>

	<div class="file-info">
		<div class="file-name" [title]="file.name">{{ file.name }}</div>
	</div>
</div>
