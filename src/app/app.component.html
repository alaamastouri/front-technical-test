<div class="container">
	<div class="sidebar">
		<div class="sidebar-header">
			<h2>File Manager</h2>
		</div>

		<div class="sidebar-actions">
			<button class="action-button primary" (click)="showUpload = !showUpload">
				Upload Files
			</button>
		</div>
	</div>

	<div class="main-content">
		<div class="content-header"></div>

		<app-upload
			*ngIf="showUpload"
			(filesSelected)="onFilesSelected($event)"
			#uploadComponent>
		</app-upload>
	</div>
</div>
